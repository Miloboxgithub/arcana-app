<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#0a0a0a"/>
  <!-- Red accent corner -->
  <polygon points="0,0 30,0 0,30" fill="#C3002F" opacity="0.8"/>
  <polygon points="100,100 70,100 100,70" fill="#C3002F" opacity="0.4"/>

  <!-- Body / uniform (Shujin Academy) -->
  <path d="M20 100 Q25 72 50 68 Q75 72 80 100 Z" fill="#1a1a2e"/>
  <!-- White shirt -->
  <path d="M35 100 Q40 76 50 73 Q60 76 65 100 Z" fill="#f0f0f0" opacity="0.9"/>
  <!-- Red tie -->
  <path d="M48 75 L52 75 L54 100 L46 100 Z" fill="#C3002F"/>
  <path d="M46 78 L54 78 L52 82 L50 80 L48 82 Z" fill="#C3002F"/>

  <!-- Head -->
  <ellipse cx="50" cy="44" rx="18" ry="20" fill="#f5dcc8"/>

  <!-- Black hair (Joker style - swept back with messy bangs) -->
  <!-- Main hair mass -->
  <ellipse cx="50" cy="30" rx="19" ry="14" fill="#111"/>
  <!-- Hair swoop to right -->
  <path d="M68 30 Q74 26 70 38 Q66 34 64 40" fill="#111"/>
  <!-- Left side hair -->
  <path d="M32 30 Q28 26 31 40 Q34 36 36 42" fill="#111"/>
  <!-- Fringe/bangs across forehead -->
  <path d="M33 34 Q36 28 42 32 Q44 29 50 30 Q56 28 60 33 Q64 30 67 35" fill="#111" stroke="#111" stroke-width="1"/>
  <!-- Joker signature curl on forehead -->
  <path d="M46 36 Q49 31 52 35 Q50 37 48 36" fill="#111"/>

  <!-- Glasses (Joker's thin-framed glasses) -->
  <rect x="35" y="44" width="11" height="7" rx="3" fill="none" stroke="#333" stroke-width="1.2"/>
  <rect x="54" y="44" width="11" height="7" rx="3" fill="none" stroke="#333" stroke-width="1.2"/>
  <line x1="46" y1="47" x2="54" y2="47" stroke="#333" stroke-width="1.2"/>
  <line x1="35" y1="47" x2="32" y2="46" stroke="#333" stroke-width="1"/>
  <line x1="65" y1="47" x2="68" y2="46" stroke="#333" stroke-width="1"/>

  <!-- Eyes (grey behind glasses, serious expression) -->
  <ellipse cx="40" cy="48" rx="3" ry="3.5" fill="#1a1a1a"/>
  <ellipse cx="59" cy="48" rx="3" ry="3.5" fill="#1a1a1a"/>
  <!-- Eye glint -->
  <circle cx="41" cy="47" r="0.8" fill="white" opacity="0.8"/>
  <circle cx="60" cy="47" r="0.8" fill="white" opacity="0.8"/>

  <!-- Eyebrows (sharp, serious) -->
  <path d="M35 42 Q40 40 45 41" stroke="#111" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M54 41 Q59 40 64 42" stroke="#111" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M49 53 Q50 55 51 53" stroke="#d4a882" stroke-width="0.8" fill="none"/>

  <!-- Mouth (slight smirk - Joker's signature) -->
  <path d="M44 59 Q50 62 56 58" stroke="#c08060" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M56 58 Q57 59 56 60" stroke="#c08060" stroke-width="1" fill="none"/>

  <!-- Phantom thief mask hint (subtle red outline around eyes) -->
  <path d="M33 44 Q40 41 47 44 Q46 51 40 52 Q34 51 33 44 Z" fill="none" stroke="#C3002F" stroke-width="0.6" opacity="0.5"/>
  <path d="M53 44 Q60 41 67 44 Q66 51 60 52 Q54 51 53 44 Z" fill="none" stroke="#C3002F" stroke-width="0.6" opacity="0.5"/>

  <!-- Red scan line at bottom (P5 UI style) -->
  <rect x="0" y="94" width="100" height="2" fill="#C3002F" opacity="0.6"/>

  <!-- Corner markers (P5 UI style) -->
  <rect x="2" y="2" width="8" height="2" fill="#C3002F" opacity="0.7"/>
  <rect x="2" y="2" width="2" height="8" fill="#C3002F" opacity="0.7"/>
  <rect x="90" y="2" width="8" height="2" fill="#C3002F" opacity="0.7"/>
  <rect x="96" y="2" width="2" height="8" fill="#C3002F" opacity="0.7"/>
</svg>
